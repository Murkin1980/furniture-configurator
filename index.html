<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конфигуратор мебели</title>
  <link rel="stylesheet" href="src/viewer.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #222; }
    .demo-wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px; }
    .demo-wrap h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .demo-wrap p { color: #666; margin-bottom: 20px; }
    .angle-label { text-align: center; font-size: 13px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <h1>Конфигуратор мебели</h1>
    <p>Модуль просмотра — 8 ракурсов</p>
    <div id="viewer"></div>
    <div class="angle-label" id="angleLabel">Вид спереди</div>
  </div>
  <script src="src/config.js"></script>
  <script src="src/schema.js"></script>
  <script src="src/urlSerializer.js"></script>
  <script src="src/imageResolver.js"></script>
  <script src="src/demo-art.js"></script>
  <script src="src/viewer.js"></script>
  <script>
    const angles = Array.from({ length: 8 }, (_, i) => sofaSVG(i));
    const viewer = new ViewerCore('#viewer', {
      animation: 'fade',
      onAngleChange: (angle) => {
        document.getElementById('angleLabel').textContent = ANGLE_LABELS[angle];
      }
    });
    viewer.setImages(angles);
  </script>
</body>
</html>
