<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конфигуратор мебели</title>
  <meta name="description" content="Визуальный конфигуратор мебели: выбор материалов, цветов, размеров, просмотр в 8 ракурсах и отправка заказа в WhatsApp.">
  <meta property="og:title" content="Конфигуратор мебели">
  <meta property="og:description" content="Настройте мебель под себя: материал, цвет, ножки, размер. 8 ракурсов просмотра.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/viewer.css">
  <link rel="stylesheet" href="src/options.css">
  <link rel="stylesheet" href="src/price.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #222; }
    .app-wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 40px; }
    .app-header { margin-bottom: 20px; }
    .app-header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .app-header p { color: #888; font-size: 14px; margin-top: 2px; }
    .product-switcher { display: flex; gap: 8px; margin-top: 12px; }
    .product-btn { padding: 8px 20px; border: 2px solid #ddd; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color 0.2s, background 0.2s, color 0.2s; }
    .product-btn:hover { border-color: #999; }
    .product-btn.active { border-color: #111; background: #111; color: #fff; }
    .angle-label { text-align: center; font-size: 13px; color: #888; margin-top: 6px; }
    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .config-grid div { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px 14px; font-size: 13px; }
    .config-grid .label { color: #888; }
    .config-grid .value { font-weight: 600; color: #222; }
    .share-bar { display: flex; gap: 10px; margin-top: 16px; }
    .share-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .share-btn:hover { opacity: 0.85; }
    .share-btn-copy { background: #111; color: #fff; }
    .share-btn-copy.copied { background: #1a7a1a; }
    .share-btn-wa { background: #25D366; color: #fff; }
    .share-btn-wa svg { width: 18px; height: 18px; fill: #fff; flex-shrink: 0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #222; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 13px; opacity: 0; transition: transform 0.3s ease, opacity 0.3s ease; pointer-events: none; z-index: 100; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    @media (max-width: 600px) {
      .app-wrap { padding: 16px 12px 32px; }
      .app-header h1 { font-size: 20px; }
      .config-grid { grid-template-columns: 1fr; }
      .share-bar { flex-direction: column; }
      .share-btn { padding: 14px; }
    }
    @media (min-width: 768px) {
      .app-wrap { padding: 32px 24px 48px; }
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="app-header">
      <h1>Конфигуратор мебели</h1>
      <p>Выберите опции и настройте товар под себя</p>
      <div class="product-switcher">
        <button class="product-btn" data-id="sofa-classic" onclick="switchToProduct('sofa-classic')">Диван</button>
        <button class="product-btn" data-id="wardrobe" onclick="switchToProduct('wardrobe')">Шкаф-купе</button>
      </div>
    </div>
    <div id="viewer"></div>
    <div class="angle-label" id="angleLabel">Вид спереди</div>
    <div id="options"></div>
    <div class="config-grid" id="configGrid"></div>
    <div id="price"></div>
    <div class="share-bar">
      <button class="share-btn share-btn-copy" id="copyLinkBtn" onclick="handleCopyLink()">Копировать ссылку</button>
      <button class="share-btn share-btn-wa" onclick="openWhatsApp(currentConfig)">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Заказать в WhatsApp
      </button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="src/config.js"></script>
  <script src="src/pricing.js"></script>
  <script src="src/schema.js"></script>
  <script src="src/urlSerializer.js"></script>
  <script src="src/imageResolver.js"></script>
  <script src="src/demo-art.js"></script>
  <script src="src/viewer.js"></script>
  <script src="src/options.js"></script>
  <script src="src/price.js"></script>
  <script src="src/whatsapp.js"></script>
  <script>
    let activeProductId = new URLSearchParams(location.search).get('product') || 'sofa-classic';

    function switchProduct(productId) {
      activeProductId = productId;
      const product = getProduct(productId);
      const defaultConfig = getDefaultConfig(productId);
      const urlConfig = deserializeConfig(location.search, defaultConfig);
      let config = { ...defaultConfig, ...urlConfig };
      config.product = productId;
      applyConfig(config);
    }

    function getProductName() {
      return getProduct(activeProductId).name;
    }

    function applyConfig(config) {
      const product = getProduct(config.product);
      syncUrl(config);
      currentConfig = config;
      optionsPanel.destroy();
      optionsPanel = new OptionsPanel('#options', {
        product,
        config,
        onChange: onConfigChange,
      });
      document.querySelectorAll('.product-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === config.product);
      });
      document.querySelector('.app-header h1').textContent = product.name;
      updateViewer(config);
      updateSummary(config);
    }

    const product = getProduct(activeProductId);
    const defaultConfig = getDefaultConfig(activeProductId);
    const urlConfig = deserializeConfig(location.search, defaultConfig);
    let currentConfig = { ...defaultConfig, ...urlConfig };
    currentConfig.product = activeProductId;

    function imageUrls(config) {
      return Array.from({ length: 8 }, (_, i) => imageResolver(config, i));
    }

    function fallbackSVG(angle) {
      const cfg = currentConfig;
      const productName = getProductName();
      const label = ANGLE_LABELS[angle];
      const detailLabels = [];
      const p = getProduct(cfg.product);
      if (p.type === 'parametric') {
        detailLabels.push(cfg.width + '×' + cfg.height + '×' + cfg.depth + ' мм');
        const matLabel = getValueLabel('material') || cfg.material;
        detailLabels.push(matLabel);
      } else {
        const keys = ['material', 'color', 'legs', 'size'];
        for (const k of keys) {
          const v = getValueLabel(k);
          if (v) detailLabels.push(v);
        }
      }
      const opts = detailLabels.join(', ');
      return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="300" fill="#f0f0f0" rx="8"/>
        <text x="200" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#999">${escapeHtml(label)}</text>
        <text x="200" y="120" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#666" font-weight="600">${escapeHtml(productName)}</text>
        <text x="200" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#888">${escapeHtml(opts)}</text>
        <rect x="120" y="190" width="160" height="50" rx="6" fill="#ddd"/>
        <text x="200" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#999">WebP: ${escapeHtml(imageResolver(cfg, angle))}</text>
      </svg>`;
    }

    function getValueLabel(optionId) {
      const p = getProduct(currentConfig.product);
      const opt = p.options.find(o => o.id === optionId);
      if (!opt) return null;
      const val = opt.values.find(v => v.id === currentConfig[optionId]);
      return val ? val.name : null;
    }

    function updateViewer(config) {
      viewer.setImages(imageUrls(config));
    }

    function onConfigChange(config) {
      currentConfig = config;
      syncUrl(config);
      updateSummary(config);
      updateViewer(config);
    }

    const viewer = new ViewerCore('#viewer', {
      animation: 'fade',
      onAngleChange: (angle) => {
        document.getElementById('angleLabel').textContent = ANGLE_LABELS[angle];
      },
      fallbackSVG,
    });
    viewer.setImages(imageUrls(currentConfig));

    const priceDisplay = new PriceDisplay('#price');

    let optionsPanel = new OptionsPanel('#options', {
      product,
      config: currentConfig,
      onChange: onConfigChange,
    });

    function updateSummary(config) {
      const p = getProduct(config.product);
      let html = '';
      if (p.type === 'parametric') {
        html += '<div><span class="label">Товар:</span> <span class="value">' + p.name + '</span></div>';
        html += '<div><span class="label">Габариты:</span> <span class="value">' + config.width + '×' + config.height + '×' + config.depth + ' мм</span></div>';
        html += '<div><span class="label">Материал:</span> <span class="value">' + (getValueLabel('material') || config.material) + '</span></div>';
        html += '<div><span class="label">Фасады:</span> <span class="value">' + (getValueLabel('facade') || config.facade) + '</span></div>';
        html += '<div><span class="label">Секции/Полки/Ящики:</span> <span class="value">' + config.sections + '/' + config.shelves + '/' + config.drawers + '</span></div>';
        if (config.fittings && config.fittings.length > 0) {
          html += '<div><span class="label">Фурнитура:</span> <span class="value">' + config.fittings.length + ' шт.</span></div>';
        }
      } else {
        html += '<div><span class="label">Товар:</span> <span class="value">' + p.name + '</span></div>';
        const fields = { Материал: 'material', Цвет: 'color', Ножки: 'legs', Размер: 'size' };
        for (const [label, key] of Object.entries(fields)) {
          const val = getValueLabel(key);
          if (val) html += '<div><span class="label">' + label + ':</span> <span class="value">' + val + '</span></div>';
        }
      }
      document.getElementById('configGrid').innerHTML = html;
      priceDisplay.update(config);
    }

    function handleCopyLink() {
      const url = buildShareUrl(currentConfig);
      copyShareLink(currentConfig);
      const btn = document.getElementById('copyLinkBtn');
      const toast = document.getElementById('toast');
      btn.textContent = 'Скопировано!';
      btn.classList.add('copied');
      toast.textContent = 'Ссылка скопирована: ' + url;
      toast.classList.add('show');
      setTimeout(() => {
        btn.textContent = 'Копировать ссылку';
        btn.classList.remove('copied');
        toast.classList.remove('show');
      }, 2500);
    }

    function switchToProduct(id) {
      const params = new URLSearchParams(location.search);
      params.set('product', id);
      const newUrl = '?' + params.toString();
      history.replaceState(null, '', newUrl);
      switchProduct(id);
    }

    document.querySelectorAll('.product-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.id === activeProductId);
    });
    document.querySelector('.app-header h1').textContent = product.name;

    updateSummary(currentConfig);
  </script>
</body>
</html>
