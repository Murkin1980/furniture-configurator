<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernel 3D view (CP-03, derived)</title>
<style>
  body{margin:0;font:14px/1.4 ui-monospace,monospace;background:#0b1020;color:#e5e7eb}
  header{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#111731;border-bottom:1px solid #26305a;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  select,button{background:#1c2547;color:#e5e7eb;border:1px solid #34406e;border-radius:6px;padding:6px 8px;font:inherit}
  a{color:#93c5fd}
  #meta{color:#9ca3af}
  #wrap{position:fixed;inset:52px 0 0 0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #err{position:fixed;inset:52px 0 0 0;display:none;place-items:center;color:#fca5a5;background:#0b1020ee;text-align:center;padding:20px}
</style>
<script type="importmap">
  { "imports": { "three": "./src/kernel/view/vendor/three.module.min.js" } }
</script>
</head>
<body>
<header>
  <h1>Kernel 3D — derived from buildProject()</h1>
  <label>fixture
    <select id="fixture">
      <option value="./fixtures/kitchen-2500x1500/project.json">L-shaped 2500 × 1500 (CP-01)</option>
      <option value="./fixtures/kitchen-multirun/project.json">Two-run + door 3000 × 2000 (CP-02)</option>
      <option value="./fixtures/kitchen-straight/project.json">Straight 4000 (CP-02)</option>
      <option value="./fixtures/kitchen-p/project.json">P-shaped two parallel runs (CP-02)</option>
    </select>
  </label>
  <button id="reset">reload</button>
  <a href="./kernel-preview.html">plan view</a>
  <span id="meta"></span>
</header>
<div id="wrap"><canvas id="gl"></canvas></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { buildProject, sceneGraph } from './src/kernel/index.js';

const $ = (s) => document.querySelector(s);
const errBox = $('#err');
const fail = (msg) => { errBox.style.display = 'grid'; errBox.textContent = msg; };

const COLORS = [0x60a5fa, 0xf59e0b, 0x34d399, 0xf472b6, 0xa78bfa, 0xf87171, 0x4ade80, 0xfacc15];

let renderer, scene, camera, group;
let theta = Math.PI / 4, phi = Math.PI / 3.2, radius = 6000;
const target = new THREE.Vector3(1250, 750, 400);

function initGL() {
  renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1020);
  camera = new THREE.PerspectiveCamera(50, 1, 10, 100000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x24304f, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.position.set(3000, 2000, 4000);
  scene.add(sun);
  group = new THREE.Group();
  scene.add(group);
}

function basisMatrix(b) {
  return new THREE.Matrix4().makeBasis(
    new THREE.Vector3(b.x.x, b.x.y, b.x.z),
    new THREE.Vector3(b.y.x, b.y.y, b.y.z),
    new THREE.Vector3(b.z.x, b.z.y, b.z.z),
    new THREE.Vector3(b.origin.x, b.origin.y, b.origin.z),
  );
}

function boxMesh(basis, min, max, material) {
  const sx = max.x - min.x, sy = max.y - min.y, sz = max.z - min.z;
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  geo.translate((min.x + max.x) / 2, (min.y + max.y) / 2, (min.z + max.z) / 2);
  geo.applyMatrix4(basisMatrix(basis));
  return new THREE.Mesh(geo, material);
}

function clearGroup() {
  while (group.children.length) {
    const m = group.children.pop();
    m.geometry?.dispose();
    m.material?.dispose();
  }
}

function populate(bundle) {
  clearGroup();
  const scene3 = sceneGraph(bundle);

  const floor = boxMesh(
    { origin: { x: 0, y: 0, z: 0 }, x: { x: 1, y: 0, z: 0 }, y: { x: 0, y: 1, z: 0 }, z: { x: 0, y: 0, z: 1 } },
    scene3.floor.min, scene3.floor.max,
    new THREE.MeshLambertMaterial({ color: 0x1f2a4d }),
  );
  group.add(floor);

  const wallMat = new THREE.MeshLambertMaterial({ color: 0x8fa3c8, transparent: true, opacity: 0.35 });
  for (const w of scene3.walls) group.add(boxMesh(w.basis, w.min, w.max, wallMat.clone()));

  scene3.modules.forEach((m, i) => {
    const mat = new THREE.MeshLambertMaterial({ color: COLORS[i % COLORS.length] });
    for (const p of m.parts) group.add(boxMesh(m.basis, p.min, p.max, mat.clone()));
  });

  // frame the room
  const f = scene3.floor;
  target.set((f.min.x + f.max.x) / 2, (f.min.y + f.max.y) / 2, 400);
  radius = Math.max(f.max.x - f.min.x, f.max.y - f.min.y) * 2.2;

  const errors = bundle.issues.filter((i) => i.severity === 'error').length;
  $('#meta').textContent =
    `${scene3.modules.length} modules · ${scene3.partCount} parts · ${errors} errors · drag = orbit, wheel = zoom`;
}

function placeCamera() {
  const x = target.x + radius * Math.sin(phi) * Math.cos(theta);
  const y = target.y + radius * Math.sin(phi) * Math.sin(theta);
  const z = target.z + radius * Math.cos(phi);
  camera.position.set(x, y, z);
  camera.lookAt(target);
}

function resize() {
  const w = $('#wrap').clientWidth, h = $('#wrap').clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

async function loadFixture(path) {
  try {
    const def = await (await fetch(path)).json();
    populate(buildProject(def));
  } catch (e) {
    fail('failed to load fixture: ' + e.message);
  }
}

try {
  initGL();
} catch (e) {
  fail('WebGL unavailable: ' + e.message);
}

if (renderer) {
  const canvas = $('#gl');
  let dragging = false, px = 0, py = 0;
  canvas.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    theta -= (e.clientX - px) * 0.005;
    phi = Math.min(Math.PI / 2 - 0.05, Math.max(0.15, phi - (e.clientY - py) * 0.005));
    px = e.clientX; py = e.clientY;
  });
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); radius *= e.deltaY > 0 ? 1.1 : 0.9; }, { passive: false });
  window.addEventListener('resize', resize);

  resize();
  await loadFixture($('#fixture').value);
  $('#fixture').addEventListener('change', (e) => loadFixture(e.target.value));
  $('#reset').addEventListener('click', () => loadFixture($('#fixture').value));

  renderer.setAnimationLoop(() => { placeCamera(); renderer.render(scene, camera); });
}
</script>
</body>
</html>
